[package]
name = "hindsight-desktop"
version = "0.2.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync"] }
tauri-plugin-updater = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSWindow", "NSPanel", "NSAppearance", "NSGraphics", "NSColor", "NSMenu", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSEvent", "NSScreen", "NSApplication", "NSRunningApplication", "NSResponder", "NSWorkspace", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSGeometry", "NSNotification", "NSOperation", "NSString"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
raw-window-handle = "0.6"
window-vibrancy = "0.8.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
