[package]
name = "hindsight-desktop"
version = "0.2.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync"] }
tauri-plugin-updater = "2"
tempfile = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
